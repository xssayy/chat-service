$kind: http-request
name: 'Get File - Not Found'
method: GET
url: '{{baseUrl}}/files/nonexistent-file.jpg'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", function () {
        pm.response.to.have.status(404);
      });
