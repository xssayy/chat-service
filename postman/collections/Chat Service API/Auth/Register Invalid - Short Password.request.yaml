$kind: http-request
name: 'Register Invalid - Short Password'
method: POST
url: '{{baseUrl}}/auth/register'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "validuser",
      "password": "123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });
