$kind: http-request
name: Login Non-existent User
method: POST
url: '{{baseUrl}}/auth/login'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "ghostuser",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
        pm.response.to.have.status(401);
      });
